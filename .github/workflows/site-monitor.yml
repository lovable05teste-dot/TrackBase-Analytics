# Dispara o monitoramento de sites da GhostScale a cada 5 minutos.
# Se o projeto na Vercel tiver CRON_SECRET, crie o mesmo valor em
# Settings → Secrets and variables → Actions → CRON_SECRET.
name: Monitoramento de sites
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar sites vencidos
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer ${CRON_SECRET}" "https://www.ghostscale.com.br/api/cron/meta?task=monitor" || echo "aviso: verificação falhou"
